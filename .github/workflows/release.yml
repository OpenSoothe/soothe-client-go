name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Verify ClientVersion matches release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CODE_VERSION=$(sed -n 's/.*const ClientVersion = "\([^"]*\)".*/\1/p' protocol.go)
          echo "ClientVersion in protocol.go: ${CODE_VERSION}"
          if [ -z "${CODE_VERSION}" ]; then
            echo "::error::Could not parse ClientVersion from protocol.go"
            exit 1
          fi
          if [ "${CODE_VERSION}" != "${VERSION}" ]; then
            echo "::error::ClientVersion (${CODE_VERSION}) does not match release tag (${VERSION})"
            exit 1
          fi
          echo "✓ ClientVersion matches release tag"

      - name: Verify
        run: make verify